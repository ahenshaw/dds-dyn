[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "fastdds-dyn"
version = "0.1.0"
description = "Fast DDS 3.6 for Python with runtime IDL types (dynamic types, samples as dicts)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[project.urls]
Source = "https://github.com/ahenshaw/fastddspy"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.py-api = "cp312"            # abi3 wheel when built with Python >= 3.12
sdist.exclude = ["deps", "wheelhouse"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-*"   # the cp312 wheel is abi3: it also covers 3.13+
skip = "*-musllinux_* *-win32 *_i686"
test-command = "python {project}/tests/test_loopback.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
# runs once per container, before any wheel: builds static Fast DDS into /project/deps
# (outside /project, so a host-built deps/ copied in with the project is never used)
before-all = "/opt/python/cp312-cp312/bin/python -m pip install cmake && PATH=/opt/python/cp312-cp312/bin:$PATH /opt/python/cp312-cp312/bin/python build_deps.py --prefix /opt/fdd/install --work /opt/fdd/work"
environment = { CMAKE_PREFIX_PATH = "/opt/fdd/install" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# short work dir: Fast DDS's build tree overflows MAX_PATH under the checkout path
before-all = "python build_deps.py --prefix C:/fdd/install --work C:/fdw"
environment = { CMAKE_PREFIX_PATH = "C:/fdd/install" }
